packages:
  - "apps/*"

# pnpm 10+ does not run dependency build scripts unless explicitly approved.
# Newer pnpm (used via `pnpm@latest` in the Docker build) treats unapproved
# build scripts as a hard error (ERR_PNPM_IGNORED_BUILDS), which breaks CI.
# Approve only the packages we trust to run install scripts.
onlyBuiltDependencies:
  - "@clerk/shared"
  - esbuild
  - unrs-resolver
